</style></head><body><header><h1>Writing Lab</h1><div class="controls"><label class="small" for="week">Week</label><select id="week"></select><div class="group"><button id="prev" aria-label="Previous challenge">←</button><select id="activity" aria-label="Challenge"></select><button id="next" aria-label="Next challenge">→</button><button id="random" title="Choose another challenge">⤨</button></div><div class="group"><input id="minutes" aria-label="Timer minutes" type="number" min="1" max="20" value="5"><span id="timer">05:00</span><button id="start">Start</button><button id="reset" title="Reset timer">↺</button></div><div class="group"><button id="size" title="Larger text" aria-label="Change text size">A↗</button><button id="theme" title="Light or dark" aria-label="Toggle light mode">◐</button><button id="full" title="Fullscreen" aria-label="Enter fullscreen"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/></svg></button><button id="print" title="Print challenge">Print</button></div></div></header><div id="progress" class="progress"></div><main><section class="mission"><div><h2 id="title"></h2><p id="brief"></p></div><div class="actions"><button id="check">Teacher check</button><button id="model">Live modelling</button></div></section><section class="source" id="source"></section><section id="tiers" class="tiers"></section></main><dialog id="helpdialog"><div class="dialoghead"><h2 id="helptitle"></h2><button data-close="helpdialog" aria-label="Close">×</button></div><div id="helpbody" class="dialogcopy"></div></dialog><dialog id="modeldialog"><div class="dialoghead"><h2>Live modelling</h2><button data-close="modeldialog" aria-label="Close">×</button></div><textarea id="modelarea" aria-label="Teacher modelling space" placeholder="Write a shared example here…"></textarea><div class="model-tools"><button data-insert="Plan: reader / purpose / useful detail\n\n">Plan</button><button data-insert="Revision: ">Revise</button><button data-insert="Evidence: ">Evidence</button><button id="clear">Clear</button></div></dialog><dialog id="copydialog"><div class="dialoghead"><h2>Copy task</h2><button data-close="copydialog" aria-label="Close">×</button></div><textarea id="copytext" readonly aria-label="Task to copy"></textarea></dialog><div id="status" class="status" role="status" aria-live="polite"></div><script>
const weeks=[{"title": "Unexpected arrivals", "activities": [{"title": "One moment, three choices", "brief": "Build a scene around a decision, not a list of sensations.", "focus": ["action", "viewpoint"], "source": "A parcel arrives at school addressed to “the student who has not arrived yet”. Inside is a timetable for a lesson called Apologising to Dinosaurs.", "tiers": [{"mode": "Scene", "prompt": "Write what your character does next. Let one object help the reader picture the moment.", "must": "An action, a concrete detail and a next step.", "goal": "Make events clear", "target": "3–4 sentences", "support": "Say: what I notice → what I do → what changes."}, {"mode": "Scene", "prompt": "Write the next moment so the character’s words and actions suggest different feelings.", "must": "One spoken line and an action that complicates it.", "goal": "Create readable subtext", "target": "4–5 sentences", "support": "Try a confident line beside a hesitant action, or the reverse."}, {"mode": "Viewpoint", "prompt": "Tell the moment from someone who wants the main character to make the wrong choice. Make their motive understandable.", "must": "A plausible motive; one clue the narrator overlooks or downplays.", "goal": "Control what we know", "target": "4–6 sentences", "support": "Choose what your narrator wants, then what they would notice or leave out."}], "notes": "Accept realistic or strange continuations. Tier 1 needs a clear sequence. Tier 2 needs a readable mismatch, not a named emotion. Tier 3 needs a motivated viewpoint; an arbitrary villain or extra adjectives do not establish it."}, {"title": "Make a case that survives a question", "brief": "Use the supplied case; no invented survey or guaranteed result.", "focus": ["reason", "evidence"], "source": "Fictional proposal: convert a disused storeroom into either a quiet reading room or a small rehearsal room. Twelve students request quiet space; ten request rehearsal space. The room shares a wall with the library. There is funding for one conversion, but bookings could be shared.", "tiers": [{"mode": "Recommendation", "prompt": "Recommend one workable option to the decision maker. Link one supplied detail to your reason.", "must": "A choice, one relevant detail and why it matters.", "goal": "Connect evidence to choice", "target": "3 sentences", "support": "I recommend … The case says … This matters because …"}, {"mode": "Negotiation", "prompt": "Recommend an option, acknowledge its strongest drawback and propose a realistic condition.", "must": "A fair objection and a condition that addresses it.", "goal": "Handle a trade-off", "target": "4–5 sentences", "support": "Name the person your plan could inconvenience before offering the condition."}, {"mode": "Evaluation", "prompt": "Compare two workable options. Make a conditional recommendation and identify one missing fact that could change it.", "must": "A comparison, a limit on your claim and a relevant unanswered question.", "goal": "Judge under uncertainty", "target": "4–6 sentences", "support": "If …, then … ; we would need to know … before …"}], "notes": "Different recommendations can succeed. Check that the reason follows from a stated detail, the condition is possible within the case, and the missing fact could actually affect the decision. Counts and circumstances are fictional."}, {"title": "Evidence or overreach?", "brief": "A defensible inference needs a clue and a limit.", "focus": ["inference", "evidence"], "source": "Tess found an extra chair beside her desk. “It is only temporary,” Mr Rao said, straightening a second name card. Tess moved her bag off the chair. When the door opened, she kept her eyes on her exercise book, but nudged the spare pencil towards the empty seat.", "tiers": [{"mode": "Inference", "prompt": "Explain one plausible feeling or intention. Quote a short clue and connect it to your idea.", "must": "A claim, a clue and an explanation.", "goal": "Support an inference", "target": "3 sentences", "support": "The action may suggest … because …"}, {"mode": "Alternative reading", "prompt": "Offer two different explanations for one action in the passage. Say which reading the text supports better.", "must": "Two plausible readings; one detail that helps distinguish them.", "goal": "Weigh interpretations", "target": "4 sentences", "support": "It could mean … Alternatively … The detail … makes … more convincing."}, {"mode": "Challenge a claim", "prompt": "A reader says: “The passage proves every character’s motive.” Challenge that claim using what is shown and what is left unstated.", "must": "One supported inference and one specific limit on what we know.", "goal": "Separate clue from certainty", "target": "4–5 sentences", "support": "We can infer … from …, but we cannot establish … because …"}], "notes": "One defensible interpretation: Tess may be willing to welcome the newcomer despite feeling awkward. Treat it as a reading, not a hidden correct answer. Reject unsupported certainty and invented backstory; reward alternatives that use the actual wording."}, {"title": "Explain the system", "brief": "All the rules you need are below; explain rather than guess.", "focus": ["sequence", "conditions"], "source": "The fictional parcel desk has three rules: a green label means the named student may collect the parcel; an amber label means the office must check the sender; no student opens an unlabelled parcel. Today, a correctly named parcel has an amber label.", "tiers": [{"mode": "Explanation", "prompt": "Explain what can happen next under these rules, and why.", "must": "A relevant rule and its consequence in today’s situation.", "goal": "Use a rule accurately", "target": "2–3 sentences", "support": "Because the rule says …, the next step is …"}, {"mode": "Walk-through", "prompt": "Explain the sequence to a newcomer. Identify one tempting but incorrect shortcut and show which rule blocks it.", "must": "Ordered steps and a rejected shortcut supported by a rule.", "goal": "Make logic followable", "target": "3–4 sentences", "support": "First … Then … ; doing … would not work because …"}, {"mode": "Test the boundary", "prompt": "Identify one thing the rules do not specify. Explain why it matters, then propose a precise extra rule without pretending it already exists.", "must": "Separate the given rule from your proposed addition.", "goal": "Spot a specification gap", "target": "4–5 sentences", "support": "The rules establish … but leave … unstated. I propose … so that …"}], "notes": "Check every conclusion against the stated rules. Students may discover an impossible sequence; do not force a successful solution. Tier 3 additions are proposals and must be labelled as such. No outside subject knowledge is required."}, {"title": "Dialogue with a job to do", "brief": "The speakers need a result; give each a reason to speak.", "focus": ["dialogue", "subtext"], "source": "Speaker A wants to claim the mystery parcel without admitting they invented its address. Speaker B runs the office and wants a verifiable name before releasing it. Neither wants to embarrass the other in front of the queue.", "tiers": [{"mode": "Exchange", "prompt": "Write four turns of dialogue: request, reply, follow-up question, next step.", "must": "Both speakers must contribute; make the next step specific.", "goal": "Move the exchange forward", "target": "4 spoken turns", "support": "Give the second speaker a reason, rather than only “yes” or “no”."}, {"mode": "Tension", "prompt": "Write six turns that reveal the disagreement without either speaker naming it directly. End with a small concession.", "must": "A revealing word choice or action; a concession that changes the exchange.", "goal": "Let readers infer the conflict", "target": "6 turns + 1 action", "support": "A concession gives up something small: time, wording, certainty or position."}, {"mode": "Double purpose", "prompt": "Write six turns in which one line means something polite publicly but carries another meaning for the other speaker. Make the second meaning inferable.", "must": "A readable double-purpose line; a concrete proposal at the end.", "goal": "Control audience and implication", "target": "6 turns + 1 action", "support": "Use a shared fact or object to make the hidden meaning visible to your reader."}], "notes": "Turns are changes of speaker, not sentences. Do not require a particular secret to be guessed. Assess whether the roles remain plausible, whether the exchange changes something, and whether subtext can be inferred from a clue."}, {"title": "Repair the record", "brief": "Correct a report without manufacturing certainty.", "focus": ["accuracy", "editing"], "source": "FACTS\nObserved: a sealed parcel arrived at 10:15; its label had no student name; the office kept it unopened. Unknown: who sent it and what it contains.\n\nREPORT TO REPAIR\nAt about ten o’clock a dangerous parcel arrived. Everyone panicked. The office hid it because they knew who had sent it.", "tiers": [{"mode": "Accuracy", "prompt": "Rewrite the report so its claims match the facts. Remove blame or certainty that the facts cannot support.", "must": "Correct time or counts where supplied; keep at least one unknown clear.", "goal": "Preserve the evidence", "target": "2–3 sentences", "support": "Start with what was observed. Say what remains unknown."}, {"mode": "Concision", "prompt": "Write the shortest useful report for a coordinator. Preserve the event, response and uncertainty; cut unsupported drama.", "must": "All three jobs: what happened, what was done, what we do not know.", "goal": "Cut without distorting", "target": "2–3 sentences", "support": "Shorter is successful only if it preserves the useful facts."}, {"mode": "Accountability", "prompt": "Write a neutral report, then one extra sentence naming a fair follow-up check. Explain why the original wording could mislead.", "must": "A factual account; a proportionate follow-up; one explanation of overreach.", "goal": "Repair meaning and responsibility", "target": "3–4 sentences + 1 explanation", "support": "A follow-up asks for evidence; it does not announce guilt."}], "notes": "Use the FACTS as the answer boundary. Strong revisions remove invented motives, absolute outcomes and unsupported blame. “No injury/opening was reported” is not the same as “none occurred”. A follow-up may request clarification but cannot invent its result."}, {"title": "Choose, borrow, rebuild", "brief": "Choose writing for its job, not just its dramatic vocabulary.", "focus": ["audience", "effect"], "source": "AUDIENCE: a reader who should sense an awkward but possible welcome\n\nDRAFT A\nThe new student entered. Tess moved her bag and offered a pencil.\n\nDRAFT B\nThe door opened like the jaws of destiny. A stranger invaded Tess’s kingdom of desks.", "tiers": [{"mode": "Comparison", "prompt": "Choose the draft that better serves this audience. Quote a short phrase and explain its effect.", "must": "A choice with a phrase-based reason.", "goal": "Judge a concrete choice", "target": "2–3 sentences", "support": "Draft … works better here because the phrase … helps …"}, {"mode": "Revision", "prompt": "Borrow the most useful detail or wording from the drafts and write a stronger version for this audience. Explain one change.", "must": "A revised version and one reason linked to the audience.", "goal": "Improve with a purpose", "target": "2–3 sentences + 1 explanation", "support": "You may reject a dramatic phrase if it distracts from the job."}, {"mode": "Transformation", "prompt": "Keep the core event or claim, but rewrite it for a clearly different audience of your choice. Name that audience and justify the change in tone.", "must": "Preserve the core meaning; show a deliberate shift in tone.", "goal": "Control register", "target": "2–3 sentences + 1 explanation", "support": "Changing audience does not give permission to change the facts."}], "notes": "There is no blanket rule that vivid writing is better or that plain writing always wins. The named audience is the criterion. Accept a defended choice, and assess transformations by accuracy and suitability."}, {"title": "Same facts, different jobs", "brief": "Transfer the information without quietly changing it.", "focus": ["purpose", "transfer"], "source": "A spare chair has been moved to the classroom doorway. Its owner has not been identified. It is not broken.", "tiers": [{"mode": "Notice", "prompt": "Write a lost-property notice. Make the most useful information easy to find.", "must": "Use only the supplied facts; choose a sensible first sentence.", "goal": "Inform clearly", "target": "2 sentences", "support": "Lead with what this reader needs to know first."}, {"mode": "Message", "prompt": "Write a polite request to keep the doorway clear. Give the reader a clear next step or question.", "must": "Accurate details and a respectful, specific request or response.", "goal": "Write for a relationship", "target": "3 sentences", "support": "Explain the situation briefly before your request or response."}, {"mode": "Two audiences", "prompt": "Write both a lost-property notice and a polite request to keep the doorway clear. Explain why one wording choice differs between them.", "must": "Keep the facts consistent while changing emphasis or tone.", "goal": "Transfer without distortion", "target": "2 sentences each + 1 explanation", "support": "Compare who can act, what they need to know, and how direct you should be."}], "notes": "Check that the two outputs differ in purpose, not in truth. Students may add greetings or a question, but cannot invent an answer, outcome or guarantee. This is a transfer task rather than another generic story sprint."}]}, {"title": "Game Over", "activities": [{"title": "One moment, three choices", "brief": "Build a scene around a decision, not a list of sensations.", "focus": ["action", "viewpoint"], "source": "The game announces GAME OVER, but the character on screen holds up a handwritten sign: YOU CAN S const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let modelLoaded=false;
let currentWeek=0,current=0,size=0,seconds=300,running=false,interval=null,deadline=0;
function item(){return weeks[currentWeek].activities[current]}
function renderSource(text){
 if(text.startsWith('FACTS\n')){const parts=text.slice(6).split('\n\nREPORT TO REPAIR\n');return '<div class="source-columns"><div><h3>Facts</h3><p>'+esc(parts[0])+'</p></div><div><h3>Report to repair</h3><p>'+esc(parts[1])+'</p></div></div>'}
 if(text.startsWith('AUDIENCE: ')){const parts=text.split('\n\nDRAFT A\n'),drafts=parts[1].split('\n\nDRAFT B\n');return '<div class="audience">'+esc(parts[0])+'</div><div class="source-columns"><div><h3>Draft A</h3><p>'+esc(drafts[0])+'</p></div><div><h3>Draft B</h3><p>'+esc(drafts[1])+'</p></div></div>'}
 return '<p>'+esc(text)+'</p>';
}

function notify(text){$('status').textContent=text;clearTimeout(notify.timeout);notify.timeout=setTimeout(()=>$('status').textContent='',3200)}
function render(){const a=item();$('title').textContent=a.title;$('brief').textContent=a.brief;$('source').innerHTML=renderSource(a.source);$('activity').value=current;$('prev').disabled=current===0;$('next').disabled=current===7;document.title='Week '+(currentWeek+1)+': '+weeks[currentWeek].title+' | Writing Lab';$('progress').style.width=((current+1)/8*100)+'%';$('tiers').innerHTML=a.tiers.map((t,i)=>'<article class="tier" style="--accent:var(--'+['one','two','three'][i]+')"><header class="tierhead"><b>Tier '+(i+1)+'</b><span class="mode">'+esc(t.mode)+'</span></header><div class="body"><p class="prompt">'+esc(t.prompt)+'</p><div class="must"><b>Include:</b> '+esc(t.must)+'</div><p class="goal">'+esc(t.goal)+'<span class="target">'+esc(t.target)+'</span></p></div><div class="cardactions"><button data-copy="'+i+'">Copy task</button><button data-help="'+i+'">Launch pad</button></div></article>').join('')}
function saveModel(){try{localStorage.setItem('writingLabModel-'+currentWeek,$('modelarea').value)}catch{}}
function loadModel(){try{$('modelarea').value=localStorage.getItem('writingLabModel-'+currentWeek)||''}catch{$('modelarea').value=''}}
function changeWeek(w){if(modelLoaded)saveModel();currentWeek=w;current=0;$('activity').innerHTML=weeks[w].activities.map((a,i)=>'<option value="'+i+'">'+(i+1)+' · '+esc(a.title)+'</option>').join('');loadModel();modelLoaded=true;reset();render()}
function changeActivity(a){current=a;reset();render()}
function timerRender(){$('timer').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');$('timer').classList.toggle('urgent',seconds<=10)}
function reset(){clearInterval(interval);interval=null;running=false;const minutes=Math.max(1,Math.min(20,Number.parseInt($('minutes').value)||5));$('minutes').value=minutes;seconds=minutes*60;$('start').textContent='Start';timerRender()}
function toggleTimer(){if(running){seconds=Math.max(0,Math.ceil((deadline-Date.now())/1000));clearInterval(interval);interval=null;running=false;$('start').textContent='Resume';timerRender();return}if(seconds<=0)reset();deadline=Date.now()+seconds*1000;running=true;$('start').textContent='Pause';interval=setInterval(()=>{seconds=Math.max(0,Math.ceil((deadline-Date.now())/1000));timerRender();if(seconds===0){clearInterval(interval);interval=null;running=false;$('start').textContent='Start';notify('Time — finish the sentence.')}},250)}
function taskText(i){const a=item(),t=a.tiers[i];return 'Writing Lab · Week '+(currentWeek+1)+' · '+weeks[currentWeek].title+'\n'+a.title+' · Tier '+(i+1)+'\n\nCASE / TEXT\n'+a.source+'\n\nTASK\n'+t.prompt+'\nInclude: '+t.must+'\nOutput: '+t.target+'\n\nLaunch pad: '+t.support}
async function copy(i){const text=taskText(i);try{await navigator.clipboard.writeText(text);notify('Task copied')}catch{$('copytext').value=text;$('copydialog').showModal();$('copytext').select()}}
$('week').innerHTML=weeks.map((w,i)=>'<option value="'+i+'">'+(i+1)+' · '+esc(w.title)+'</option>').join('');$('week').onchange=()=>changeWeek(Number($('week').value));$('activity').onchange=()=>changeActivity(Number($('activity').value));$('prev').onclick=()=>{if(current>0)changeActivity(current-1)};$('next').onclick=()=>{if(current<7)changeActivity(current+1)};$('random').onclick=()=>{const options=weeks[currentWeek].activities.map((_,i)=>i).filter(i=>i!==current);changeActivity(options[Math.floor(Math.random()*options.length)])};$('tiers').onclick=event=>{const c=event.target.closest('[data-copy]');if(c)copy(Number(c.dataset.copy));const h=event.target.closest('[data-help]');if(h){const i=Number(h.dataset.help);$('helptitle').textContent='Tier '+(i+1)+' · Launch pad';$('helpbody').textContent=item().tiers[i].support;$('helpdialog').showModal()}};$('check').onclick=()=>{$('helptitle').textContent='Teacher check · '+item().title;$('helpbody').textContent=item().notes;$('helpdialog').showModal()};$('model').onclick=()=>{$('modeldialog').showModal();$('modelarea').focus()};$('modelarea').oninput=saveModel;$('clear').onclick=()=>{$('modelarea').value='';saveModel();$('modelarea').focus()};document.querySelectorAll('[data-insert]').forEach(b=>b.onclick=()=>{const a=$('modelarea');a.setRangeText(b.dataset.insert,a.selectionStart,a.selectionEnd,'end');saveModel();a.focus()});document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).close());$('start').onclick=toggleTimer;$('reset').onclick=reset;$('minutes').onchange=reset;$('size').onclick=()=>{size=(size+1)%3;document.documentElement.style.setProperty('--font',[20,23,26][size]+'px')};$('theme').onclick=()=>document.body.classList.toggle('light');$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{notify('Use your browser’s fullscreen command.')}};document.addEventListener('fullscreenchange',()=>{$('full').setAttribute('aria-label',document.fullscreenElement?'Exit fullscreen':'Enter fullscreen');$('full').setAttribute('aria-pressed',Boolean(document.fullscreenElement))});$('print').onclick=()=>window.print();document.addEventListener('keydown',event=>{if(event.target.closest('input,textarea,select')||document.querySelector('dialog[open]'))return;if(event.key==='ArrowRight'&&current<7){event.preventDefault();changeActivity(current+1)}if(event.key==='ArrowLeft'&&current>0){event.preventDefault();changeActivity(current-1)}if(event.key==='PageDown'&&currentWeek<9){event.preventDefault();$('week').value=currentWeek+1;changeWeek(currentWeek+1)}if(event.key==='PageUp'&&currentWeek>0){event.preventDefault();$('week').value=currentWeek-1;changeWeek(currentWeek-1)}});window.addEventListener('beforeunload',saveModel);changeWeek(0);
</script></body></html>
